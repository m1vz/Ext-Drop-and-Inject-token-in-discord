<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <style>
    body { width: 280px; padding: 15px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    h3 { font-size: 16px; margin-top: 0; color: #333; }
    input { width: 100%; margin-bottom: 10px; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    button { width: 100%; cursor: pointer; padding: 8px; border: none; border-radius: 4px; margin-bottom: 5px; font-weight: bold; }
    
    .btn-login { background: #5865F2; color: white; }
    .btn-login:hover { background: #4752c4; }
    
    .btn-extract { background: #3ba55c; color: white; }
    .btn-extract:hover { background: #2d8544; }

    .btn-copy { background: #ed4245; color: white; margin-top: 10px; display: none; }
    
    #status { font-size: 12px; color: #666; margin-top: 10px; word-wrap: break-word; }
    .token-display { width: 100%; height: 60px; font-size: 10px; margin-top: 10px; display: none; }
    
  </style>
</head>
<body>
  <h3>m1vz </h3>
  
  <hr>
  <p style="font-size: 12px; font-weight: bold;">Injetar Token (Login):</p>
  <input type="text" id="tokenInput" placeholder="Cole o token aqui">
  <button class="btn-login" id="loginBtn">Logar via Token</button>
  
  <hr>
  <p style="font-size: 12px; font-weight: bold;">Extrair Token (Sessão Ativa):</p>
  <button class="btn-extract" id="extractBtn">Capturar Token da Aba</button>
  
  <textarea id="tokenOutput" class="token-display" readonly></textarea>
  <button class="btn-copy" id="copyBtn">Copiar Token</button>
  
  <div id="status">Aguardando ação...</div>

  <script src="popup.js"></script>
</body>
</html>
